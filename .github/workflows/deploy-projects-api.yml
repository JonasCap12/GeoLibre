name: Deploy projects API

on:
  push:
    branches: [main]
    paths:
      - "workers/projects-api/**"
      - ".github/workflows/deploy-projects-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-projects-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy projects and identity API to Cloudflare Workers
    runs-on: ubuntu-latest
    # workflow_dispatch can target any branch; only ever deploy main to
    # production so a manual run cannot publish unmerged code.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # This worker has a real runtime dependency (scrypt-js) that wrangler must
      # bundle, so the workspace deps have to be installed before deploy, the
      # way deploy-tiles.yml does for upng-js.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w geolibre-projects-api-worker

      # Stops a deploy that would 500 every signed-in request (schema not yet
      # migrated) or run without the bot check or two-factor (secrets unset).
      # Read-only; see the script header.
      - name: Check D1 schema and Worker secrets
        working-directory: workers/projects-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/predeploy-check.mjs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/projects-api
