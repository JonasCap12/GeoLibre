name: Deploy viewer

# FORK CHANGE: the automatic push trigger is removed. See the note in
# deploy-collab.yml. This fork has no separate viewer deployment --
# VITE_GEOLIBRE_VIEWER_URL points at the main web Worker -- so there is nothing
# for this to deploy to.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-viewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy viewer proxy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/viewer
