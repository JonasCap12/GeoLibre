name: Deploy collab

# FORK CHANGE: the automatic push trigger is removed.
#
# This workflow runs a bare `wrangler deploy`, which picks up
# workers/collab/wrangler.toml and its `collab.geolibre.app` custom domain.
# Only the upstream Cloudflare account can provision that hostname, so on this
# fork every run fails -- and a red X that always fails is worse than no check,
# because it trains everyone to ignore the red ones that matter.
#
# deploy-collab-selfhost.yml deploys the same Worker from
# wrangler.selfhost.jsonc and is what runs here.
#
# Kept rather than deleted so an upstream sync sees a normal edit instead of a
# delete/modify conflict, and so the workflow can still be run by hand from the
# Actions tab by anyone who does own collab.geolibre.app.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-collab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy collaboration relay to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/collab
