name: Deploy tiles (self-host)

# Fork-specific replacement for deploy-tiles.yml.
#
# That workflow is upstream-tracked and runs a bare `wrangler deploy`, which
# picks up workers/tiles/wrangler.toml and its `tiles.geolibre.app` custom
# domain. Only the upstream Cloudflare account can provision that hostname, so
# on this fork the upstream workflow fails every time it runs. This one deploys
# the same Worker from wrangler.selfhost.jsonc instead, to
# geolibre-tiles.<subdomain>.workers.dev.
#
# Disable "Deploy tiles" in the Actions tab (workflow -> ... -> Disable) rather
# than editing or deleting it: that is a repository setting, so it survives
# every upstream sync without a merge conflict in a tracked file.
#
# Deploying this Worker changes nothing on its own. The app keeps calling
# tiles.geolibre.app until the repo variable VITE_GEOLIBRE_TILES_URL names this
# deployment and the web deploy is re-run. See docs/independence.md.

on:
  push:
    branches: [main]
    paths:
      - "workers/tiles/**"
      - ".github/workflows/deploy-tiles-selfhost.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tiles-selfhost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy planetary tile proxy to Cloudflare Workers
    runs-on: ubuntu-latest
    # workflow_dispatch can target any branch; only ever deploy main to
    # production so a manual run can't publish unmerged code.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Unlike the viewer/collab workers, this one has a real runtime dependency
      # (upng-js) that wrangler must bundle, so the workspace deps have to be
      # installed before deploy. wrangler-action does not install for us.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/tiles
          command: deploy -c wrangler.selfhost.jsonc
